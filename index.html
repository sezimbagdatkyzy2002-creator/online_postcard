<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Цифровая Открытка</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Google Fonts for Cyrillic support -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Merriweather:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
</head>
<body>
  <div class="card-container">
    <div class="card">
      <!-- Front Side -->
      <div class="card-side front">
        <img src="https://picsum.photos/600/400" alt="Обложка открытки">
        <div class="front-title">Привет!</div>
      </div>
      <!-- Back Side -->
      <div class="card-side back">
        <div class="message">
          <p>Дорогой друг,</p>
          <p>Надеюсь, у тебя отличный день! Посылаю самые тёплые пожелания.</p>
          <p class="signature">— Ульсезим</p>
        </div>
        <div class="divider"></div>
        <div class="stamp-section">
          <div class="stamp">МАРКА</div>
          <div class="address">
            <p>Кому: Моему лучшему другу</p>
            <p>ул. Интернета, д. 101</p>
            <p>Сеть, 010000</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
